<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>QuanTriage system architecture</title>
  <desc>Data sources feed quantum and imaging models, which are exposed through a Streamlit app and a training studio, producing classification, localization and 3-D rendering outputs. All local and GPU-accelerated.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8895a7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="#f7f9fc"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#16233f">QuanTriage — System Architecture</text>
  <g font-size="12" fill="#5a6b85">
    <rect x="372" y="48" width="13" height="13" rx="3" fill="#e7d9f7" stroke="#8e5fd6"/>
    <text x="391" y="59">Quantum</text>
    <rect x="470" y="48" width="13" height="13" rx="3" fill="#d6f0ec" stroke="#17a2a2"/>
    <text x="489" y="59">Imaging</text>
    <text x="560" y="59">·  all local · GPU (M5 / MPS)</text>
  </g>

  <!-- DATA -->
  <text x="30" y="86" font-size="12" font-weight="700" fill="#8895a7" letter-spacing="1">DATA SOURCES</text>
  <g font-size="13.5" fill="#16233f">
    <g>
      <rect x="30" y="94" width="220" height="54" rx="9" fill="#eef2f7" stroke="#b8c4d4"/>
      <text x="140" y="116" text-anchor="middle" font-weight="600">Breast cancer</text>
      <text x="140" y="134" text-anchor="middle" font-size="11.5" fill="#5a6b85">sklearn · binary</text>
    </g>
    <g>
      <rect x="270" y="94" width="220" height="54" rx="9" fill="#eef2f7" stroke="#b8c4d4"/>
      <text x="380" y="116" text-anchor="middle" font-weight="600">Pan-cancer RNA-seq</text>
      <text x="380" y="134" text-anchor="middle" font-size="11.5" fill="#5a6b85">TCGA · 5 tumor types</text>
    </g>
    <g>
      <rect x="510" y="94" width="220" height="54" rx="9" fill="#eef2f7" stroke="#b8c4d4"/>
      <text x="620" y="116" text-anchor="middle" font-weight="600">Your CSV (Kaggle)</text>
      <text x="620" y="134" text-anchor="middle" font-size="11.5" fill="#5a6b85">bring-your-own data</text>
    </g>
    <g>
      <rect x="750" y="94" width="220" height="54" rx="9" fill="#eef2f7" stroke="#b8c4d4"/>
      <text x="860" y="116" text-anchor="middle" font-weight="600">Brain MRI + masks</text>
      <text x="860" y="134" text-anchor="middle" font-size="11.5" fill="#5a6b85">MSD · real scans</text>
    </g>
  </g>
  <line x1="250" y1="150" x2="235" y2="170" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="760" y1="150" x2="775" y2="170" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- MODELS -->
  <text x="30" y="168" font-size="12" font-weight="700" fill="#8895a7" letter-spacing="1">MODELS</text>
  <!-- quantum group -->
  <rect x="30" y="174" width="400" height="254" rx="12" fill="#f3eefb" stroke="#8e5fd6" stroke-width="1.5"/>
  <text x="46" y="198" font-size="15" font-weight="700" fill="#5b2ca0">Quantum ML</text>
  <g font-size="13" fill="#16233f">
    <rect x="46" y="208" width="368" height="44" rx="8" fill="#e7d9f7" stroke="#c4a8ea"/>
    <text x="58" y="227" font-weight="600">Variational classifier</text>
    <text x="58" y="244" font-size="11.5" fill="#5a4a78">angle · amplitude · data re-uploading</text>
    <rect x="46" y="258" width="368" height="44" rx="8" fill="#e7d9f7" stroke="#c4a8ea"/>
    <text x="58" y="277" font-weight="600">Multi-class — 5 tumor types</text>
    <text x="58" y="294" font-size="11.5" fill="#5a4a78">softmax over qubit read-outs</text>
    <rect x="46" y="308" width="368" height="44" rx="8" fill="#e7d9f7" stroke="#c4a8ea"/>
    <text x="58" y="327" font-weight="600">PyTorch hybrid</text>
    <text x="58" y="344" font-size="11.5" fill="#5a4a78">classical layers + quantum TorchLayer</text>
    <rect x="46" y="360" width="368" height="30" rx="8" fill="#efe6fb" stroke="#c4a8ea"/>
    <text x="230" y="380" text-anchor="middle" font-size="11.5" fill="#5b2ca0">backends: default.qubit · lightning · IBM · Braket</text>
  </g>
  <!-- imaging group -->
  <rect x="570" y="174" width="400" height="254" rx="12" fill="#eafaf7" stroke="#17a2a2" stroke-width="1.5"/>
  <text x="586" y="198" font-size="15" font-weight="700" fill="#0f7d7d">Medical imaging</text>
  <g font-size="13" fill="#16233f">
    <rect x="586" y="208" width="368" height="44" rx="8" fill="#d6f0ec" stroke="#9ed9d0"/>
    <text x="598" y="227" font-weight="600">U-Net 2-D · multi-modal</text>
    <text x="598" y="244" font-size="11.5" fill="#2a6b66">4 MRI channels · sub-regions · WT 0.91</text>
    <rect x="586" y="258" width="368" height="44" rx="8" fill="#d6f0ec" stroke="#9ed9d0"/>
    <text x="598" y="277" font-weight="600">U-Net 3-D · volumetric</text>
    <text x="598" y="294" font-size="11.5" fill="#2a6b66">through-plane context · TC 0.92</text>
    <rect x="586" y="308" width="368" height="44" rx="8" fill="#d6f0ec" stroke="#9ed9d0"/>
    <text x="598" y="327" font-weight="600">Radiomics + 3-D render</text>
    <text x="598" y="344" font-size="11.5" fill="#2a6b66">tumor on the organ, interactive</text>
    <rect x="586" y="360" width="368" height="30" rx="8" fill="#defaf3" stroke="#9ed9d0"/>
    <text x="770" y="380" text-anchor="middle" font-size="11.5" fill="#0f7d7d">GPU-accelerated · Apple-Silicon MPS</text>
  </g>
  <!-- bridge -->
  <rect x="440" y="246" width="120" height="110" rx="10" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="500" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b8631a">Bridge</text>
  <text x="500" y="304" text-anchor="middle" font-size="11" fill="#9a5418">radiomics</text>
  <text x="500" y="320" text-anchor="middle" font-size="11" fill="#9a5418">→ quantum</text>
  <text x="500" y="336" text-anchor="middle" font-size="11" fill="#9a5418">circuit</text>
  <line x1="570" y1="301" x2="562" y2="301" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="440" y1="301" x2="432" y2="301" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>

  <line x1="230" y1="428" x2="255" y2="460" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="770" y1="428" x2="745" y2="460" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- INTERFACES -->
  <text x="30" y="458" font-size="12" font-weight="700" fill="#8895a7" letter-spacing="1">INTERFACES</text>
  <g font-size="13.5" fill="#16233f">
    <rect x="30" y="464" width="450" height="54" rx="10" fill="#e8f0fe" stroke="#4a78c8"/>
    <text x="255" y="486" text-anchor="middle" font-weight="600">Streamlit app — 6 tabs</text>
    <text x="255" y="504" text-anchor="middle" font-size="11.5" fill="#3a5a90">predict · performance · trust · 3-D scan · types · localization</text>
    <rect x="520" y="464" width="450" height="54" rx="10" fill="#e8f0fe" stroke="#4a78c8"/>
    <text x="745" y="486" text-anchor="middle" font-weight="600">Live training studio</text>
    <text x="745" y="504" text-anchor="middle" font-size="11.5" fill="#3a5a90">your data · live epochs · model state · checkpoints</text>
  </g>
  <line x1="255" y1="518" x2="255" y2="550" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="745" y1="518" x2="745" y2="550" stroke="#8895a7" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- OUTPUTS -->
  <text x="30" y="548" font-size="12" font-weight="700" fill="#8895a7" letter-spacing="1">OUTPUTS</text>
  <rect x="30" y="554" width="940" height="56" rx="10" fill="#eafaf0" stroke="#27ae60"/>
  <text x="500" y="578" text-anchor="middle" font-size="13.5" font-weight="600" fill="#16233f">what (cancer type) · where (localization) · sub-regions · 3-D tumor on organ</text>
  <text x="500" y="598" text-anchor="middle" font-size="12.5" fill="#2f7a4f">selective prediction (defer to a doctor) · honest metrics · saved checkpoints</text>

  <text x="500" y="638" text-anchor="middle" font-size="12" fill="#8895a7">Educational / research prototype — not a validated medical device.</text>
</svg>
